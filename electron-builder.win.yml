appId: com.ningli.dshgui
productName: DSH GUI
directories:
  buildResources: build
  output: dist-win
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/tray
    to: resources/tray
  - from: resources/dsh-runtime-win
    to: resources/dsh-runtime-win
  # 内置真 node.exe:Electron 内嵌 Node 下 koffi.view 原生崩溃,
  # DSH 的 win32 目录选择 worker 需要真 Node(fetch:runtime --platform win32 物化)
  - from: resources/node-runtime-win
    to: resources/node-runtime-win
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DSH GUI
  artifactName: DSH-GUI-Setup-${version}-x64.exe
